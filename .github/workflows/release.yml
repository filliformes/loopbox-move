name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          JSON_VERSION=$(jq -r '.version' overtake-shell/module.json)
          if [ "$TAG_VERSION" != "$JSON_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match module.json version ($JSON_VERSION)"
            exit 1
          fi

      - name: Build (Docker cross-compile ARM64)
        working-directory: overtake-shell
        run: bash scripts/build.sh

      - name: Package
        run: |
          mkdir -p dist
          # tarball must extract to loopbox/ containing module.json
          tar -czf dist/loopbox-module.tar.gz -C overtake-shell/dist loopbox
          tar -tzf dist/loopbox-module.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/loopbox-module.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release.json
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          REPO="${{ github.repository }}"
          URL="https://github.com/$REPO/releases/download/v$VERSION/loopbox-module.tar.gz"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # tag builds are detached HEAD: land on the default branch BEFORE writing
          BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          git fetch origin "$BRANCH"
          git checkout -f "$BRANCH"
          echo "{\"version\": \"$VERSION\", \"download_url\": \"$URL\"}" > release.json
          git add release.json
          if git diff --cached --quiet; then
            echo "release.json already current"
          else
            git commit -m "chore: update release.json for v$VERSION [skip ci]"
            git push origin "$BRANCH"
          fi
